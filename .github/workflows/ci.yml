name: KruschBizLaw CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test Suite & Benchmark Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e ".[dev]"

      - name: Code Quality & Lint Gate (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Invariants, Security, Properties, API)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          pytest tests/ -v

      - name: 60-Second Headless Demo Verification
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          python scripts/demo_60s.py

      - name: Benchmark Evaluation Gate (11/11 Scenarios)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          python scripts/eval_benchmark.py

      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Python ${{ matrix.python-version }})" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true

      - name: Dispatch Webhook Alert (Optional)
        if: failure() && env.CI_WEBHOOK != ''
        env:
          CI_WEBHOOK: ${{ secrets.CI_FAILURE_WEBHOOK }}
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **CI Failure**: [${{ github.repository }}#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed on \`${{ github.ref_name }}\` (Commit: \`${{ github.sha }}\`)\"}" \
            "$CI_WEBHOOK" || true
