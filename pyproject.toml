[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krusch-bizlaw"
version = "0.2.0"
description = "Sovereign Cross-Domain Statutory Compliance Engine & Contract-vs-Statute Join Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kevin Ruschman", email = "ksruschman@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "streamlit>=1.31.0",
    "sqlalchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"scripts/*" = ["E402", "F401"]
"src/frontend/*" = ["E402", "F401"]
