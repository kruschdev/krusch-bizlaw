name: KruschBizLaw CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint, Test Suite & Benchmark Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e ".[dev]"

      - name: Code Quality & Lint Gate (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Invariants, Security, Properties, API)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          pytest tests/ -v

      - name: 60-Second Headless Demo Verification
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          python scripts/demo_60s.py

      - name: Benchmark Evaluation Gate (11/11 Scenarios)
        env:
          APP_ENV: development
          ALLOW_LAN: 1
        run: |
          python scripts/eval_benchmark.py
